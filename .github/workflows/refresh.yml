name: Refresh jobs

on:
  schedule:
    # Every 12 hours (00:00 and 12:00 UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest jobs
        env:
          FEED_BASE: ${{ secrets.FEED_BASE }}
        run: python fetch.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/jobs.json)" ]; then
            git add data/jobs.json
            git commit -m "Refresh jobs feed"
            git push
          else
            echo "No changes."
          fi
